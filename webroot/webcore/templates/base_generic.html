<!DOCTYPE html>
<html lang="en">
  <head>
    {% block title %}
      <title>Data Management Tool</title>
    {% endblock %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
     rel="js" 
     integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
     crossorigin="anonymous"/>
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

    <!-- Add additional CSS in static file -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />

  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        {% block sidebar %}
        <div class="col-sm-1 col" style="display:flex; flex-direction:column;">
        <div style="display:flex; flex-direction: column; min-height: 87vh;" class="sidebar-nav border-end">
          <div class="text-dark flex" style="flex-direction: column;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
              <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
              <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
            </svg>
            <span id="user_name" class="col-md-1">User</span>
          </div>
          <div id="dashboard_button" style="display:flex;flex-direction: column;">
            <a href="{% url 'index' %}" class="btn btn-outline-light" aria-describedby="Dashboardspan">
              <lord-icon src="https://cdn.lordicon.com/dqrpfjei.json"
                  delay="500"
                  state="hover-roll"
                  style="width:50px;height:50px">
              </lord-icon></a><span role="tooltip" id="Dashboardspan">Dashboard</span>
          </div>
          
           <div id="stock_button" style="display:flex;flex-direction: column;">
             <a class="btn btn-outline-light" href="{% url 'stock'%}" aria-describedby="stockspan">
              <lord-icon
                  src="https://cdn.lordicon.com/ajfmgpbq.json"
                  delay="500"
                  stroke="bold"
                  state="hover-growth"
                  style="width:50px;height:50px">
            </lord-icon></a><span role="tooltip" id="stockspan">Stock</span></div>
            <div id="workshop_button" style="display:flex;flex-direction: column;">
              <a class="btn btn-outline-light btn-links" href="{% url 'workshop'%}" aria-describedby="workshopspan">
              <lord-icon
                  src="https://cdn.lordicon.com/raldojya.json"
                  stroke="bold"
                  style="width:50px;height:50px">
            </lord-icon></a><span id="workshopspan" role="tooltip">Workshop</span></div>
           <div id="insurance_button" style="display:flex;flex-direction: column;">
            <a class="btn btn-outline-light" href="{% url 'insurance'%}" aria-describedby="insurancespan">
              <lord-icon
              src="https://cdn.lordicon.com/fhszghjk.json"
              style="width:50px;height:50px">
          </lord-icon></a><span id="insurancespan" role="tooltip">Insurance</span></div>
            <div id="service_button" style="display:flex;flex-direction: column;">
              <a class="btn btn-outline-light btn-links" href="{% url 'service'%}" aria-describedby="servicespan"><lord-icon
              src="https://cdn.lordicon.com/xsqjakgm.json"
              delay="800"
              stroke="bold"
              state="hover-unfold"
              style="width:50px;height:50px">
          </lord-icon></a><span id="servicespan" role="tooltip">Service</span></div>
          <div id="department_button" style="display:flex;flex-direction: column;">
            <a class="btn btn-outline-light" href="{% url 'department'%}" aria-describedby="departmentspan"><lord-icon
            src="https://cdn.lordicon.com/hojnqwxj.json"
            stroke="bold"
            style="width:50px;height:50px">
        </lord-icon></a><span id="departmentspan" role="tooltip">Department</span></div>
        </div>
        <form style="position: fixed; margin-top: 87vh;">
          <a class="btn btn-outline-danger" style="margin-top:auto;" href="{% url 'logout' %}"><lord-icon
            src="https://cdn.lordicon.com/xzalkbkz.json"
            trigger="hover"
            style="width:50px;height:50px">
          </lord-icon><br/>Sign out</a>
        </form>
      </div>
        {% endblock %}
        <div class="col-sm-9">
          {% block content %}
          {% endblock %}
        </div>
        <div class="col">{% block extra_data %}
          {% endblock %}</div>
      </div>
    </div>
    <!-- <script>
        $(document).ready(function(){
            $('[data-toggle="tooltip"]').tooltip();
        });
    </script> -->
    <!-- <link href="{% static 'js/main.js' %}" /> -->
    <script>
      $(document).ready(function(){
        $.ajax({
                  url: '{% url "get_user" %}',
                  success: function(data) {
                      $('#user_name').text(data.user);
                  }
        });
      });

      //   $(document).ready(function() {
      //     $('#ajax-button').click(function() {
              
      //     });
      // });
    </script>
    {% block extra_scripts %}
    {% endblock %}
    
  </body>
</html>
