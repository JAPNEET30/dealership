<!DOCTYPE html>
<html lang="en">
  <head>
    {% block title %}
      <title>Local Library</title>
    {% endblock %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
     rel="js" 
     integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
     crossorigin="anonymous"/>
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <!-- Add additional CSS in static file -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />

  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-2">
          {% block sidebar %}
          <ul class="sidebar-nav">
            <li class="btn flex" style="overflow: hidden;" id="dashboardLink"><a href="{% url 'index' %}" data-toggle="tooltip" data-placement="right" title="Dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house" viewBox="0 0 16 16">
                <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/></svg>
            </a></li> 
            <li class="btn" style="overflow: hidden;" id="stockLink"><a class="btn btn-dark" href="">Stock</a></li>
            <li class="btn" style="overflow: hidden;" id="workshoplink"><a class="btn btn-dark" href="">Workshop</a></li>
            <li class="btn" style="overflow: hidden;" id="servicelink"><a class="btn btn-dark" href="">Service Tracker</a></li>
            <li class="btn" style="overflow: hidden;" id="insurancelink"><a class="btn btn-dark" href="">Insurance</a></li>
            <li class="btn" style="overflow: hidden;" id="departmentlink"><a class="btn btn-dark" href="">Department</a></li>
          </ul>
          <button class="btn btn-light"><lord-icon
            src="https://cdn.lordicon.com/xzalkbkz.json"
            trigger="hover"
            style="width:100px;height:100px">
        </lord-icon></button>
          {% endblock %}
        </div>
        <div class="col-sm-10 ">{% block content %}{% endblock %}</div>
      </div>
    </div>
    <script>
        $(document).ready(function(){
            $('[data-toggle="tooltip"]').tooltip();
        });
    </script>
    <!-- <link href="{% static 'js/main.js' %}" /> -->
    
  </body>
</html>
