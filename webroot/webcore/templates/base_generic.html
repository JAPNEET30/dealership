<!DOCTYPE html>
<html lang="en">
  <head>
    {% block title %}
      <title>Local Library</title>
    {% endblock %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
     rel="js" 
     integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
     crossorigin="anonymous"/>
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <!-- Add additional CSS in static file -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />

  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        {% block sidebar %}
        <div class="col-sm-1" style="display:flex; flex-direction:column;">
        <div style="display:flex; flex-direction: column; min-height: 87vh;" class="sidebar-nav">
          <a href="{% url 'index' %}" class="btn btn-outline-light" aria-describedby="Dashboardspan">
            <lord-icon src="https://cdn.lordicon.com/dqrpfjei.json"
                trigger="hover"
                delay="500"
                state="hover-roll"
                style="width:50px;height:50px">
            </lord-icon></a><span role="tooltip" id="Dashboardspan">Dashboard</span>
            <a class="btn btn-outline-light" href="{% url 'stock'%}" aria-describedby="stockspan">
              <lord-icon
                  src="https://cdn.lordicon.com/ajfmgpbq.json"
                  trigger="hover"
                  delay="500"
                  stroke="bold"
                  state="hover-growth"
                  style="width:50px;height:50px">
            </lord-icon></a><span role="tooltip" id="stockspan">Stock</span>
            <a class="btn btn-outline-light btn-links" href="{% url 'workshop'%}" aria-describedby="workshopspan">
              <lord-icon
                  src="https://cdn.lordicon.com/raldojya.json"
                  trigger="hover"
                  stroke="bold"
                  style="width:50px;height:50px">
            </lord-icon></a><span id="workshopspan" role="tooltip">Workshop</span>
            <a class="btn btn-outline-light" href="{% url 'insurance'%}" aria-describedby="insurancespan">
              <lord-icon
              src="https://cdn.lordicon.com/fhszghjk.json"
              trigger="hover"
              style="width:50px;height:50px">
          </lord-icon></a><span id="insurancespan" role="tooltip">Insurance</span>
            <a class="btn btn-outline-light" href="{% url 'department'%}" aria-describedby="departmentspan"><lord-icon
                  src="https://cdn.lordicon.com/hojnqwxj.json"
                  trigger="hover"
                  stroke="bold"
                  style="width:50px;height:50px">
              </lord-icon></a><span id="departmentspan" role="tooltip">Department</span>
            <a class="btn btn-outline-light btn-links" href="{% url 'service'%}" aria-describedby="servicespan"><lord-icon
              src="https://cdn.lordicon.com/xsqjakgm.json"
              trigger="hover"
              delay="800"
              stroke="bold"
              state="hover-unfold"
              style="width:50px;height:50px">
          </lord-icon></a><span id="servicespan" role="tooltip">Service</span>
        </div>
        <form style="position: fixed; margin-top: 87vh;">
          <button class="btn btn-outline-light" style="margin-top:auto;"><lord-icon
            src="https://cdn.lordicon.com/xzalkbkz.json"
            trigger="hover"
            style="width:50px;height:50px">
          </lord-icon></button>
        </form>
      </div>
        {% endblock %}
        <div class="col-sm-10">{% block content %}
          {% endblock %}</div>
      </div>
    </div>
    <!-- <script>
        $(document).ready(function(){
            $('[data-toggle="tooltip"]').tooltip();
        });
    </script> -->
    <!-- <link href="{% static 'js/main.js' %}" /> -->
    
  </body>
</html>
